name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Run build
        run: npm run build --if-present

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Package artifact
        run: |
          mkdir -p deploy-artifact
          tar -czf deploy-artifact/backend.tar.gz .

      - name: Deploy to AWS
        run: |
          echo "Production deployment would run here."
          echo "The application should be deployed through CodeDeploy, ASG rollout, or a deployment job configured with the AWS credentials."

      - name: Health check
        run: |
          echo "Check ALB /health after deployment"
          echo "curl -f http://$(terraform output -raw alb_dns_name 2>/dev/null || echo ALB_DNS)/health || exit 1"
