name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # validate:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout source
  #       uses: actions/checkout@v4

  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: npm

  #     - name: Install dependencies
  #       run: npm ci --if-present

  #     - name: Run tests
  #       run: npm test --if-present

  #     - name: Run build
  #       run: npm run build --if-present

  deploy:
    # needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Discover bastion and backend instances
        id: discover
        run: |
          BASTION_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Component,Values=bastion" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].PublicIpAddress' --output text)

          BACKEND_IPS=$(aws ec2 describe-instances \
            --filters "Name=tag:Component,Values=backend" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].PrivateIpAddress' --output text)

          if [ -z "$BASTION_IP" ] || [ -z "$BACKEND_IPS" ]; then
            echo "Could not discover bastion or backend instances" >&2
            exit 1
          fi

          echo "bastion_ip=$BASTION_IP" >> "$GITHUB_OUTPUT"
          echo "backend_ips=$BACKEND_IPS" >> "$GITHUB_OUTPUT"
          echo "Bastion: $BASTION_IP"
          echo "Backends: $BACKEND_IPS"

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/tv_key.pem
          chmod 600 ~/.ssh/tv_key.pem

      - name: Rolling deploy to each backend instance
        env:
          BASTION_IP: ${{ steps.discover.outputs.bastion_ip }}
          BACKEND_IPS: ${{ steps.discover.outputs.backend_ips }}
        run: |
          SSH_OPTS="-i ~/.ssh/tv_key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10"

          for IP in $BACKEND_IPS; do
            echo "=== Deploying to $IP ==="
            ssh $SSH_OPTS \
              -o ProxyCommand="ssh $SSH_OPTS -W %h:%p ubuntu@$BASTION_IP" \
              ubuntu@$IP '
                set -e
                git config --global --add safe.directory /home/ubuntu/bmi-health-tracker-ec2-server || true
                sudo -u ubuntu git -C /home/ubuntu/bmi-health-tracker-ec2-server fetch --all
                sudo -u ubuntu git -C /home/ubuntu/bmi-health-tracker-ec2-server reset --hard origin/main
                bash deploy/before_install.sh
                bash deploy/after_install.sh
                bash deploy/start_app.sh
              '
            echo "=== $IP deployed and validated ==="
          done

      - name: Final ALB health check
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?contains(LoadBalancerName, 'tv-3tier-production')].DNSName" \
            --output text)
          echo "Checking https://$ALB_DNS/health"
          curl -fsS "http://$ALB_DNS/health"